<!doctype html>
<html lang="ar-EG">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Talaat Market — Supermarket Management System" />
    <meta name="theme-color" content="#0f172a" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <title>Talaat Market — نظام إدارة السوبر ماركت</title>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('talaat_theme') || 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          var lang = localStorage.getItem('talaat_lang') || 'ar';
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
